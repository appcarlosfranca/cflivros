<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101c2d"><meta name="description" content="Biblioteca Lispenser — histórias para revisitar."><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="app.css"><title>Biblioteca Lispenser</title></head><body>
<div id="app"><header class="topbar"><button class="logo" data-action="home" aria-label="Ir ao início"><span class="logoMark">✦</span><span>LISPENCER<small>BIBLIOTECA DIGITAL</small></span></button><div class="headerActions"><button class="iconButton" data-action="search" title="Buscar na biblioteca">⌕</button><button class="iconButton" data-action="settings" title="Configurações">⚙</button></div></header>
<main id="main" tabindex="-1"></main><nav class="bottomNav" aria-label="Navegação principal"><button data-action="home" class="navitem active"><span>⌂</span>Início</button><button data-action="library" class="navitem"><span>▤</span>Biblioteca</button><button data-action="bookmarks" class="navitem"><span>♧</span>Marcadores</button><button data-action="settings" class="navitem"><span>⚙</span>Ajustes</button></nav></div>
<section id="reader" class="reader hidden" aria-label="Leitor de livros"><div id="readerTop" class="readerTop"><button class="iconButton" data-action="close-reader" title="Voltar">←</button><div class="readerTitle" id="readerTitle"></div><button class="iconButton" data-action="toggle-bookmark" title="Marcar página">♧</button><button class="iconButton" data-action="toggle-panel" title="Sumário e marcadores">☷</button><button class="iconButton" data-action="reader-settings" title="Ajustes do leitor">Aa</button></div><div class="readerBody" id="readerBody"><div class="tapZone tapLeft" data-action="prev-page" aria-label="Página anterior"></div><div id="pageStage" class="pageStage"></div><div class="tapZone tapRight" data-action="next-page" aria-label="Próxima página"></div></div><div class="readerBottom" id="readerBottom"><button data-action="prev-page" aria-label="Anterior">‹</button><span id="readerPosition">1 / 1</span><input id="readerRange" type="range" min="1" max="1" value="1" aria-label="Selecionar página"><button data-action="next-page" aria-label="Próxima">›</button></div><aside class="sidePanel hidden" id="sidePanel"><div class="panelHead"><strong>Explorar livro</strong><button data-action="toggle-panel">✕</button></div><div class="panelTabs"><button data-action="panel-tab" data-tab="toc" class="active">Capítulos</button><button data-action="panel-tab" data-tab="marks">Marcadores</button><button data-action="panel-tab" data-tab="find">Buscar</button></div><div id="panelContent" class="panelContent"></div></aside></section>
<div class="modalBackdrop hidden" id="modalBackdrop"><section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Janela de opções"></section></div><input type="file" id="filePicker" accept="application/pdf,.pdf" hidden><div id="toast" class="toast" role="status"></div><script src="app.js" defer></script></body></html>
